# Base profile for aind-beaker-submit. Render it; do not submit placeholders.
version: v2
description: aind-torch-utils automated single-node eight-GPU Ray run
budget: "ai1/aihub-nd-exaspim"
retry:
  allowedTaskRetries: 5
tasks:
  - name: denoise-template
    image:
      # Use an immutable Beaker image ID, not a mutable image name.
      beaker: "01KZV3AY3389Q98D0X1VW2ZWGA"
    command:
      - /opt/aind-torch-utils/beaker/run-with-gpu-metrics.sh
    arguments:
      - --num-shards
      - "8"
      - --cpus-per-shard
      - "24"
      - --gpus-per-shard
      - "1"
      - --prep-workers
      - "7"
      - --writer-workers
      - "17"
      - --thread-dump-interval
      - "3600"
      - --metrics-json-template
      - "/results/metrics_shard{shard}.json"
      - --in-spec
      - __INPUT_SPEC__
      - --out-spec
      - __OUTPUT_SPEC__
      - --workflow
      - denoise-net
      - --workflow-params
      - __WORKFLOW_PARAMS__
      - --config
      - __INFERENCE_CONFIG__
    envVars:
      - name: AWS_ACCESS_KEY_ID
        secret: "BEAKER_AWS_ACCESS_KEY_ID_SECRET"
      - name: AWS_SECRET_ACCESS_KEY
        secret: "BEAKER_AWS_SECRET_ACCESS_KEY_SECRET"
      - name: AWS_REGION
        value: "us-west-2"
      - name: AWS_DEFAULT_REGION
        value: "us-west-2"
      - name: AWS_RETRY_MODE
        value: "standard"
      - name: AWS_MAX_ATTEMPTS
        value: "10"
      - name: TENSORSTORE_S3_REQUEST_CONCURRENCY
        value: "256"
      - name: TENSORSTORE_HTTP2_MAX_CONCURRENT_STREAMS
        value: "64"
      - name: TENSORSTORE_HTTP_THREADS
        value: "16"
      - name: OMP_NUM_THREADS
        value: "1"
      - name: GPU_METRICS_INTERVAL
        value: "1"
      - name: RAY_DEDUP_LOGS
        value: "0"
      - name: RAY_TMPDIR
        value: /results/ray-tmp

    datasets:
      - mountPath: /config
        source:
          beaker: "01KZV0TS6G9WWVNFMYSSAETY75"
    result:
      path: /results
    resources:
      gpuCount: 8
      cpuCount: 192
      memory: 2000GB
      sharedMemory: 64GiB
    replicas: 1
    # Keep enough wall time for full-resolution inference and task retries.
    timeout: "72h"
    context:
      cluster: "ai1/aipbd-aws-h200"
      priority: normal
      minRuntime: 0
      # Current Beaker rejects legacy preemptible and autoResume together.
      # Non-preemptible work cannot be auto-resumed; leave autoResume unset.
